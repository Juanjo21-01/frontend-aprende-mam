<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AprendeMam">
  <!-- La letra ẍ dibujada como trazos, no como texto: un favicon no puede depender de
       que el sistema tenga una fuente con U+1E8D. -->
