  <g stroke="#fdfcf9" stroke-width="3" stroke-linecap="round">
    <line x1="10" y1="16" x2="22" y2="26"/>
    <line x1="22" y1="16" x2="10" y2="26"/>
  </g>
  <g fill="#fdfcf9">
    <circle cx="13" cy="10" r="2"/>
    <circle cx="19" cy="10" r="2"/>
  </g>
</svg>
